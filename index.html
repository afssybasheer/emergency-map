<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Emergency Corridor — Live Map</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --red:    #ff2d2d;
    --blue:   #1e90ff;
    --green:  #00e676;
    --orange: #ff9100;
    --dark:   #0a0e1a;
    --card:   rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --mono:   'Share Tech Mono', monospace;
    --sans:   'Rajdhani', sans-serif;
  }

  html,body{
    height:100%;
    background:var(--dark);
    color:#fff;
    font-family:var(--sans);
    overflow:hidden;
  }

  /* ── HEADER ── */
  #header{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    height:52px;
    background:rgba(10,14,26,0.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;
  }
  #header .logo{
    display:flex;align-items:center;gap:10px;
    font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:1px;
    color:#fff;
  }
  #header .logo .pulse{
    width:10px;height:10px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 rgba(0,230,118,0.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%  {box-shadow:0 0 0 0   rgba(0,230,118,0.6)}
    70% {box-shadow:0 0 0 10px rgba(0,230,118,0)}
    100%{box-shadow:0 0 0 0   rgba(0,230,118,0)}
  }
  #emergencyBadge{
    font-family:var(--mono);font-size:11px;letter-spacing:2px;
    padding:4px 12px;border-radius:4px;
    background:rgba(255,45,45,0.15);
    border:1px solid rgba(255,45,45,0.4);
    color:var(--red);
    transition:all 0.3s;
  }
  #emergencyBadge.active{
    background:rgba(255,45,45,0.3);
    border-color:var(--red);
    animation:flashBadge 1s infinite;
  }
  @keyframes flashBadge{
    0%,100%{opacity:1}50%{opacity:0.5}
  }

  /* ── MAP ── */
  #map{
    position:fixed;
    top:52px;left:0;right:280px;bottom:0;
  }

  /* ── SIDEBAR ── */
  #sidebar{
    position:fixed;
    top:52px;right:0;bottom:0;width:280px;
    background:rgba(10,14,26,0.96);
    border-left:1px solid var(--border);
    overflow-y:auto;
    padding:12px;
    display:flex;flex-direction:column;gap:10px;
  }

  .section-title{
    font-family:var(--mono);font-size:10px;letter-spacing:2px;
    color:rgba(255,255,255,0.3);
    text-transform:uppercase;
    padding:4px 0;
    border-bottom:1px solid var(--border);
    margin-bottom:4px;
  }

  /* ── AMBULANCE CARD ── */
  .ambu-card{
    background:var(--card);
    border:1px solid rgba(255,45,45,0.2);
    border-radius:8px;
    padding:12px;
  }
  .ambu-card .label{
    font-family:var(--mono);font-size:10px;color:var(--red);
    letter-spacing:1.5px;margin-bottom:8px;
  }
  .ambu-card .coords{
    font-family:var(--mono);font-size:11px;
    color:rgba(255,255,255,0.7);line-height:1.8;
  }
  .ambu-card .coords span{color:#fff;font-weight:600}

  /* ── POLE CARDS ── */
  .pole-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    transition:border-color 0.3s, background 0.3s;
  }
  .pole-card.active{
    border-color:var(--orange);
    background:rgba(255,145,0,0.06);
  }
  .pole-card .pole-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .pole-card .pole-name{
    font-family:var(--sans);font-weight:700;font-size:14px;
    color:#fff;
  }
  .siren-badge{
    font-family:var(--mono);font-size:9px;letter-spacing:1px;
    padding:3px 8px;border-radius:3px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    color:rgba(255,255,255,0.3);
    transition:all 0.3s;
  }
  .siren-badge.on{
    background:rgba(255,145,0,0.2);
    border-color:var(--orange);
    color:var(--orange);
    animation:flashBadge 0.8s infinite;
  }
  .pole-card .dist{
    font-family:var(--mono);font-size:11px;
    color:rgba(255,255,255,0.5);
  }
  .pole-card .dist span{
    color:var(--blue);font-size:13px;font-weight:600;
  }
  .dist-bar-wrap{
    margin-top:8px;
    height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;
  }
  .dist-bar{
    height:100%;border-radius:2px;
    background:var(--blue);
    transition:width 1s ease, background 0.3s;
  }

  /* ── DISTANCE READOUT ── */
  .stat-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 0;border-bottom:1px solid var(--border);
    font-size:12px;color:rgba(255,255,255,0.4);
  }
  .stat-row:last-child{border-bottom:none}
  .stat-row .val{
    font-family:var(--mono);color:#fff;font-size:12px;
  }

  /* ── MAP CUSTOM STYLES ── */
  .gm-style .gm-style-iw{
    background:#0d1225 !important;
    border:1px solid rgba(30,144,255,0.3) !important;
  }
  .info-box{
    font-family:'Rajdhani',sans-serif;
    color:#fff;padding:6px 8px;min-width:120px;
  }
  .info-box .ib-title{font-weight:700;font-size:14px;margin-bottom:4px}
  .info-box .ib-sub{font-size:12px;color:rgba(255,255,255,0.5)}
  .info-box .ib-dist{font-size:13px;color:#1e90ff;margin-top:4px;font-weight:600}

  /* scrollbar */
  #sidebar::-webkit-scrollbar{width:4px}
  #sidebar::-webkit-scrollbar-track{background:transparent}
  #sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div class="logo">
    <div class="pulse"></div>
    EMERGENCY CORRIDOR SYSTEM
  </div>
  <div id="emergencyBadge">● STANDBY</div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- SIDEBAR -->
<div id="sidebar">

  <div class="section-title">Ambulance</div>
  <div class="ambu-card">
    <div class="label">🚑 LIVE LOCATION</div>
    <div class="coords">
      LAT &nbsp;<span id="aLat">—</span><br>
      LNG &nbsp;<span id="aLng">—</span><br>
      SPEED &nbsp;<span id="aSpeed">—</span> km/h
    </div>
  </div>

  <div class="section-title" style="margin-top:4px">Pole Status</div>

  <!-- Pole 1 -->
  <div class="pole-card" id="pCard1">
    <div class="pole-header">
      <div class="pole-name">📍 Pole 1</div>
      <div class="siren-badge" id="sBadge1">SILENT</div>
    </div>
    <div class="dist">Distance: <span id="dist1">—</span> m</div>
    <div class="dist-bar-wrap"><div class="dist-bar" id="bar1" style="width:0%"></div></div>
  </div>

  <!-- Pole 2 -->
  <div class="pole-card" id="pCard2">
    <div class="pole-header">
      <div class="pole-name">📍 Pole 2</div>
      <div class="siren-badge" id="sBadge2">SILENT</div>
    </div>
    <div class="dist">Distance: <span id="dist2">—</span> m</div>
    <div class="dist-bar-wrap"><div class="dist-bar" id="bar2" style="width:0%"></div></div>
  </div>

  <!-- Pole 3 -->
  <div class="pole-card" id="pCard3">
    <div class="pole-header">
      <div class="pole-name">📍 Pole 3</div>
      <div class="siren-badge" id="sBadge3">SILENT</div>
    </div>
    <div class="dist">Distance: <span id="dist3">—</span> m</div>
    <div class="dist-bar-wrap"><div class="dist-bar" id="bar3" style="width:0%"></div></div>
  </div>

  <div class="section-title" style="margin-top:4px">System Info</div>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px">
    <div class="stat-row"><span>Last update</span><span class="val" id="lastUpdate">—</span></div>
    <div class="stat-row"><span>Trigger radius</span><span class="val">100 m</span></div>
    <div class="stat-row"><span>Active poles</span><span class="val" id="activePoles">0 / 3</span></div>
    <div class="stat-row"><span>Blynk status</span><span class="val" style="color:var(--green)">● LIVE</span></div>
  </div>

</div>

<!-- Google Maps + Blynk Integration -->
<script>
// ═══════════════════════════════════════════════
//  CONFIGURATION — update these if needed
// ═══════════════════════════════════════════════
const BLYNK_TOKEN   = "YOUR_AMBULANCE_AUTH_TOKEN"; // paste Ambulance_Phone auth token
const BLYNK_SERVER  = "https://blynk.cloud/external/api";
const POLL_INTERVAL = 2000; // fetch every 2 seconds

// Fixed pole coordinates (match your .ino files)
const POLES = [
  { id:1, name:"Pole 1 — Oushadhi Jn",  lat:10.117323, lng:76.475925 },
  { id:2, name:"Pole 2 — Signal Jn",     lat:10.114586, lng:76.478328 },
  { id:3, name:"Pole 3 — Main Jn",       lat:10.113504, lng:76.478404 },
];

// ═══════════════════════════════════════════════
//  MAP GLOBALS
// ═══════════════════════════════════════════════
let map, ambulanceMarker, ambulancePath;
let poleMarkers   = [];
let poleCircles   = [];
let poleInfoWins  = [];
let pathCoords    = [];
let prevLatLng    = null;
let emergencyOn   = false;
let sirenState    = [false, false, false];
let activePoleCount = 0;

// ═══════════════════════════════════════════════
//  HAVERSINE — metres between two coords
// ═══════════════════════════════════════════════
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, r=Math.PI/180;
  const dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
  const a=Math.sin(dLat/2)**2
         +Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ═══════════════════════════════════════════════
//  INIT MAP
// ═══════════════════════════════════════════════
function initMap(){
  const center = { lat:10.115, lng:76.477 };

  map = new google.maps.Map(document.getElementById("map"),{
    zoom:15,
    center,
    mapTypeId:"roadmap",
    styles: [
      {elementType:"geometry",         stylers:[{color:"#0d1225"}]},
      {elementType:"labels.text.fill", stylers:[{color:"#8ec3b9"}]},
      {elementType:"labels.text.stroke",stylers:[{color:"#1a3646"}]},
      {featureType:"road",elementType:"geometry",stylers:[{color:"#1a2744"}]},
      {featureType:"road",elementType:"geometry.stroke",stylers:[{color:"#255763"}]},
      {featureType:"road",elementType:"labels.text.fill",stylers:[{color:"#98a5be"}]},
      {featureType:"water",elementType:"geometry",stylers:[{color:"#0e1d2e"}]},
      {featureType:"poi",elementType:"geometry",stylers:[{color:"#0c1626"}]},
      {featureType:"transit",elementType:"geometry",stylers:[{color:"#2f3948"}]},
    ],
    disableDefaultUI: false,
    zoomControl: true,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: true,
  });

  // Draw pole markers
  POLES.forEach((pole,i)=>{
    const marker = new google.maps.Marker({
      position: {lat:pole.lat, lng:pole.lng},
      map,
      title: pole.name,
      icon:{
        path: google.maps.SymbolPath.CIRCLE,
        scale: 10,
        fillColor: "#1e90ff",
        fillOpacity: 1,
        strokeColor: "#fff",
        strokeWeight: 2,
      },
      label:{
        text: String(pole.id),
        color:"#fff",
        fontWeight:"bold",
        fontSize:"11px",
      }
    });

    // 100m trigger circle
    const circle = new google.maps.Circle({
      map,
      center: {lat:pole.lat, lng:pole.lng},
      radius: 100,
      strokeColor: "#1e90ff",
      strokeOpacity: 0.5,
      strokeWeight: 1.5,
      fillColor: "#1e90ff",
      fillOpacity: 0.06,
    });

    // Info window
    const iw = new google.maps.InfoWindow({
      content:`<div class="info-box">
        <div class="ib-title">${pole.name}</div>
        <div class="ib-sub">Lat: ${pole.lat.toFixed(6)}</div>
        <div class="ib-sub">Lng: ${pole.lng.toFixed(6)}</div>
        <div class="ib-dist" id="iw-dist-${pole.id}">— m away</div>
      </div>`
    });

    marker.addListener("click",()=> iw.open(map,marker));

    poleMarkers.push(marker);
    poleCircles.push(circle);
    poleInfoWins.push(iw);
  });

  // Ambulance marker (hidden until GPS arrives)
  ambulanceMarker = new google.maps.Marker({
    map,
    visible: false,
    title: "Ambulance",
    zIndex: 999,
    icon:{
      url:"https://maps.google.com/mapfiles/kml/shapes/cabs.png",
      scaledSize: new google.maps.Size(32,32),
      anchor: new google.maps.Point(16,16),
    }
  });

  // GPS trail
  ambulancePath = new google.maps.Polyline({
    map,
    strokeColor: "#ff2d2d",
    strokeOpacity: 0.8,
    strokeWeight: 3,
    path: [],
  });

  // Start polling Blynk
  fetchBlynk();
  setInterval(fetchBlynk, POLL_INTERVAL);
}

// ═══════════════════════════════════════════════
//  FETCH BLYNK DATA
// ═══════════════════════════════════════════════
async function fetchBlynk(){
  try{
    // Fetch V5 (ambulance location), V10 (emergency), V2/V3/V4 (siren status)
    const [r5, r10, r2, r3, r4] = await Promise.all([
      fetch(`${BLYNK_SERVER}/get?token=${BLYNK_TOKEN}&V5`),
      fetch(`${BLYNK_SERVER}/get?token=${BLYNK_TOKEN}&V10`),
      fetch(`${BLYNK_SERVER}/get?token=${BLYNK_TOKEN}&V2`),
      fetch(`${BLYNK_SERVER}/get?token=${BLYNK_TOKEN}&V3`),
      fetch(`${BLYNK_SERVER}/get?token=${BLYNK_TOKEN}&V4`),
    ]);

    const loc    = await r5.json();
    const emerg  = await r10.json();
    const s1     = await r2.json();
    const s2     = await r3.json();
    const s3     = await r4.json();

    // Emergency switch
    emergencyOn = parseInt(emerg[0]) === 1;
    updateEmergencyUI(emergencyOn);

    // Ambulance location — V5 returns [lat, lng] array for Location type
    if(loc && loc.length >= 2){
      const lat = parseFloat(loc[0]);
      const lng = parseFloat(loc[1]);
      if(!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0){
        updateAmbulance(lat, lng);
      }
    }

    // Siren states from ESP32 feedback
    updateSiren(0, parseInt(s1[0])===1);
    updateSiren(1, parseInt(s2[0])===1);
    updateSiren(2, parseInt(s3[0])===1);

    // Timestamp
    const now = new Date();
    document.getElementById("lastUpdate").textContent =
      now.toLocaleTimeString('en-IN',{hour12:false});

  } catch(e){
    console.warn("Blynk fetch error:", e);
  }
}

// ═══════════════════════════════════════════════
//  UPDATE AMBULANCE POSITION
// ═══════════════════════════════════════════════
function updateAmbulance(lat, lng){
  const pos = {lat, lng};

  ambulanceMarker.setPosition(pos);
  ambulanceMarker.setVisible(true);

  // Add to trail
  pathCoords.push(pos);
  if(pathCoords.length > 200) pathCoords.shift(); // keep last 200 points
  ambulancePath.setPath(pathCoords);

  // Update sidebar
  document.getElementById("aLat").textContent   = lat.toFixed(6);
  document.getElementById("aLng").textContent   = lng.toFixed(6);

  // Calculate speed
  if(prevLatLng){
    const d = haversine(prevLatLng.lat, prevLatLng.lng, lat, lng);
    const spd = (d / (POLL_INTERVAL/1000)) * 3.6;
    document.getElementById("aSpeed").textContent = spd.toFixed(1);
  }
  prevLatLng = {lat, lng};

  // Update distances to each pole
  activePoleCount = 0;
  POLES.forEach((pole,i)=>{
    const dist = haversine(lat, lng, pole.lat, pole.lng);
    updatePoleDistance(i, dist);
    if(sirenState[i]) activePoleCount++;
  });
  document.getElementById("activePoles").textContent =
    activePoleCount + " / 3";

  // Auto-pan if emergency active
  if(emergencyOn) map.panTo(pos);
}

// ═══════════════════════════════════════════════
//  UPDATE POLE DISTANCE UI
// ═══════════════════════════════════════════════
function updatePoleDistance(i, dist){
  const distEl  = document.getElementById(`dist${i+1}`);
  const barEl   = document.getElementById(`bar${i+1}`);

  distEl.textContent = Math.round(dist);

  // Bar fills as ambulance approaches — 0m=full, 500m=empty
  const pct = Math.max(0, Math.min(100, (1 - dist/500)*100));
  barEl.style.width = pct + "%";
  barEl.style.background = dist <= 100 ? "#ff9100" : "#1e90ff";

  // Update info window distance
  const iwDist = document.getElementById(`iw-dist-${i+1}`);
  if(iwDist) iwDist.textContent = Math.round(dist) + " m away";
}

// ═══════════════════════════════════════════════
//  UPDATE SIREN STATE
// ═══════════════════════════════════════════════
function updateSiren(i, isOn){
  sirenState[i] = isOn;
  const card   = document.getElementById(`pCard${i+1}`);
  const badge  = document.getElementById(`sBadge${i+1}`);
  const circle = poleCircles[i];
  const marker = poleMarkers[i];

  if(isOn){
    card.classList.add("active");
    badge.classList.add("on");
    badge.textContent = "🔊 SIREN ON";
    circle.setOptions({strokeColor:"#ff9100",fillColor:"#ff9100",fillOpacity:0.12,strokeOpacity:0.9});
    marker.setIcon({
      path:google.maps.SymbolPath.CIRCLE,
      scale:12,
      fillColor:"#ff9100",
      fillOpacity:1,
      strokeColor:"#fff",
      strokeWeight:2,
    });
  } else {
    card.classList.remove("active");
    badge.classList.remove("on");
    badge.textContent = "SILENT";
    circle.setOptions({strokeColor:"#1e90ff",fillColor:"#1e90ff",fillOpacity:0.06,strokeOpacity:0.5});
    marker.setIcon({
      path:google.maps.SymbolPath.CIRCLE,
      scale:10,
      fillColor:"#1e90ff",
      fillOpacity:1,
      strokeColor:"#fff",
      strokeWeight:2,
    });
  }
}

// ═══════════════════════════════════════════════
//  EMERGENCY UI
// ═══════════════════════════════════════════════
function updateEmergencyUI(on){
  const badge = document.getElementById("emergencyBadge");
  if(on){
    badge.textContent = "🚨 EMERGENCY ACTIVE";
    badge.classList.add("active");
  } else {
    badge.textContent = "● STANDBY";
    badge.classList.remove("active");
  }
}
</script>

<!-- Load Google Maps -->
<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCZTcbUZWXIPy-55oqgt75R1EzmIOWFFHo&callback=initMap">
</script>

</body>
</html>
