<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Emergency Corridor System</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0a0e1a;
  color:white;
}

#map{
  height:100vh;
  width:calc(100% - 300px);
}

#sidebar{

  position:fixed;
  top:0;
  right:0;
  width:300px;
  height:100%;
  background:#111827;
  padding:15px;
  overflow:auto;

}

.card{

  background:#1f2937;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;

}

.title{

  font-size:13px;
  color:#9ca3af;
  margin-bottom:10px;

}

.active{

  color:#ff9100;
  font-weight:bold;

}

.silent{

  color:#9ca3af;

}

</style>

</head>

<body>

<div id="map"></div>

<div id="sidebar">

<div class="card">

<div class="title">🚑 AMBULANCE</div>

LAT :
<span id="lat">--</span>

<br><br>

LNG :
<span id="lng">--</span>

<br><br>

STATUS :
<span id="status">STANDBY</span>

</div>

<div class="card">

<div class="title">📍 POLE 1 — MENAKA</div>

Distance :
<span id="d1">--</span> m

<br><br>

SIREN :
<span id="s1" class="silent">SILENT</span>

</div>

<div class="card">

<div class="title">📍 POLE 2 — MARINE DRIVE</div>

Distance :
<span id="d2">--</span> m

<br><br>

SIREN :
<span id="s2" class="silent">SILENT</span>

</div>

<div class="card">

<div class="title">📍 POLE 3 — HIGH COURT</div>

Distance :
<span id="d3">--</span> m

<br><br>

SIREN :
<span id="s3" class="silent">SILENT</span>

</div>

</div>

<script>

// ======================================================
// BLYNK CONFIG
// ======================================================

const BLYNK_TOKEN =
"oXfBxr0og5eToyPAsXhBoGhdsqmBePbR";

const SERVER =
"https://blynk.cloud/external/api";

// ======================================================
// POLE LOCATIONS
// ======================================================

const POLES = [

{
id:1,
name:"Menaka",
lat:9.981700,
lng:76.276500
},

{
id:2,
name:"Marine Drive",
lat:9.978900,
lng:76.280800
},

{
id:3,
name:"High Court",
lat:9.986400,
lng:76.281900
}

];

// ======================================================
// MAP
// ======================================================

const map = L.map('map').setView(
[9.982500,76.279000],
15
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

// ======================================================
// POLE MARKERS
// ======================================================

const poleMarkers = [];

POLES.forEach((pole)=>{

const marker = L.marker(
[pole.lat,pole.lng]
)
.addTo(map)
.bindPopup(pole.name);

poleMarkers.push(marker);

// RADIUS

L.circle(
[pole.lat,pole.lng],
{

radius:300,
color:'#1e90ff',
fillColor:'#1e90ff',
fillOpacity:0.1

}
).addTo(map);

});

// ======================================================
// AMBULANCE MARKER
// ======================================================

const ambulanceIcon = L.divIcon({

html:`
<div style="
background:red;
width:22px;
height:22px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:2px solid white;
font-size:12px;
box-shadow:0 0 15px red;
">
🚑
</div>
`,

className:'',
iconSize:[22,22]

});

let ambulanceMarker = L.marker(
[9.981500,76.278000],
{
icon:ambulanceIcon
}
).addTo(map);

let path = [];

let polyline = L.polyline(path,{
color:'red',
weight:4
}).addTo(map);

// ======================================================
// DISTANCE FUNCTION
// ======================================================

function haversine(lat1,lon1,lat2,lon2){

const R = 6371000;

const toRad = x => x * Math.PI / 180;

const dLat = toRad(lat2-lat1);
const dLon = toRad(lon2-lon1);

const a =

Math.sin(dLat/2) * Math.sin(dLat/2)

+

Math.cos(toRad(lat1)) *
Math.cos(toRad(lat2)) *

Math.sin(dLon/2) *
Math.sin(dLon/2);

const c = 2 * Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

return R*c;

}

// ======================================================
// UPDATE SIREN UI
// ======================================================

function updateSiren(id,on){

const el = document.getElementById("s"+id);

if(on){

el.innerHTML = "🔊 ACTIVE";
el.className = "active";

}
else{

el.innerHTML = "SILENT";
el.className = "silent";

}

}

// ======================================================
// FETCH LIVE BLYNK DATA
// ======================================================

async function fetchData(){

try{

// LOCATION

const rLoc = await fetch(

`${SERVER}/get?token=${BLYNK_TOKEN}&pin=V5`

);

const loc = await rLoc.json();

// EMERGENCY BUTTON

const rEmergency = await fetch(

`${SERVER}/get?token=${BLYNK_TOKEN}&pin=V10`

);

const emergency = await rEmergency.json();

const emergencyOn =
parseInt(emergency[0]) === 1;

// STATUS

document.getElementById("status").innerHTML =

emergencyOn
?
"🚨 ACTIVE"
:
"STANDBY";

// ======================================================
// GPS
// ======================================================

// BLYNK FORMAT:
// LONGITUDE , LATITUDE

const lng = parseFloat(loc[0]);
const lat = parseFloat(loc[1]);

if(
!isNaN(lat)
&&
!isNaN(lng)
){

// UPDATE UI

document.getElementById("lat").innerHTML =
lat.toFixed(6);

document.getElementById("lng").innerHTML =
lng.toFixed(6);

// MOVE AMBULANCE

ambulanceMarker.setLatLng([lat,lng]);

map.panTo([lat,lng]);

// ROUTE PATH

path.push([lat,lng]);

polyline.setLatLngs(path);

// ======================================================
// DISTANCE CHECK
// ======================================================

POLES.forEach((pole,index)=>{

const dist = haversine(

lat,
lng,
pole.lat,
pole.lng

);

document.getElementById(

"d"+(index+1)

).innerHTML =

Math.round(dist);

// SIREN AUTO ACTIVATION

if(
dist <= 300
&&
emergencyOn
){

updateSiren(index+1,true);

}
else{

updateSiren(index+1,false);

}

});

}

}
catch(err){
console.log(err);
}
}
// ======================================================
// LIVE UPDATE
// ======================================================

fetchData();

setInterval(fetchData,2000);

</script>

</body>

</html>
